# โปรไฟล์ production — เปิดด้วย SPRING_PROFILES_ACTIVE=prod
#
# ตัวแปรที่ "ไม่มีค่าเริ่มต้น" ตั้งใจให้เป็นแบบนั้น ถ้าลืมตั้งแอปจะไม่ยอมสตาร์ท
# ดีกว่าปล่อยให้ขึ้นระบบไปพร้อมรหัสลับค่าเริ่มต้นที่ใคร ๆ ก็เดาได้
spring:
  datasource:
    # ค่าเริ่มต้นเป็น PostgreSQL (Neon) — บังคับ SSL
    # ถ้าจะกลับไปใช้ MySQL ตั้ง DB_URL กับ DB_DRIVER ทับได้เลย ไม่ต้องแก้โค้ด เช่น
    #   DB_URL=jdbc:mysql://host:3306/db?useUnicode=true&characterEncoding=UTF-8&sslMode=REQUIRED
    #   DB_DRIVER=com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=require}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
    hikari:
      # ฐานข้อมูลฟรีมักจำกัดจำนวน connection — ตั้งไว้ต่ำ ๆ ให้พอดีกับ instance เล็ก
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate        # Flyway เป็นเจ้าของ schema
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        jdbc:
          # ไดรเวอร์ PostgreSQL ยังไม่รองรับ createClob() — ถ้าไม่ปิด Hibernate จะไปเรียก
          # แล้วได้ SQLFeatureNotSupportedException พร้อมทำให้ connection ถูกตีตราว่าเสีย
          lob:
            non_contextual_creation: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    # {vendor} ให้ Flyway เลือกโฟลเดอร์ตามชนิดฐานข้อมูลเอง (postgresql / mysql)
    # จึงสลับฐานข้อมูลได้ด้วยการเปลี่ยน DB_URL อย่างเดียว
    locations: classpath:db/migration/{vendor}

server:
  # Koyeb/Render กำหนดพอร์ตผ่านตัวแปร PORT
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: text/html,text/css,application/javascript,application/json,image/svg+xml
  error:
    include-message: never
    include-stacktrace: never

app:
  jwt:
    secret: ${JWT_SECRET}       # ต้องยาว >= 32 ตัวอักษร
    expiration-ms: ${JWT_EXPIRATION_MS:28800000}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD} # ไม่มีค่าเริ่มต้นโดยตั้งใจ

logging:
  level:
    root: warn
    com.chp.invoice: info
