server:
  # ใช้ 8082 เพราะเครื่องนี้ 8080 ถูก Docker และ 8081 ถูกแอปอื่นใช้อยู่ (เปลี่ยนได้ด้วย env SERVER_PORT)
  # PORT มาก่อน เพราะแพลตฟอร์มอย่าง Koyeb/Render กำหนดพอร์ตมาให้ผ่านตัวแปรนี้
  port: ${PORT:${SERVER_PORT:8082}}

spring:
  application:
    name: chp-invoice-backend

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:chp_invoice}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Bangkok&createDatabaseIfNotExist=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate          # ใช้ Flyway จัดการ schema — Hibernate แค่ตรวจสอบ
    open-in-view: false
    properties:
      hibernate:
        # ไม่ระบุ dialect — ปล่อยให้ Hibernate ตรวจเองจาก JDBC URL
        # ถ้าฮาร์ดโค้ดไว้ พอสลับไป PostgreSQL มันจะยังสร้าง SQL แบบ MySQL แล้วพังตอนรัน
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    # {vendor} = mysql / postgresql — ต้องใส่ ไม่งั้นจะหา migration ไม่เจอ
    # เพราะไฟล์ถูกแยกโฟลเดอร์ตามชนิดฐานข้อมูลแล้ว
    locations: classpath:db/migration/{vendor}

# การตั้งค่า JWT (ใช้จริงใน Phase 2)
app:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-random-secret-key-at-least-32-bytes-long!!}
    expiration-ms: 28800000        # 8 ชั่วโมง

logging:
  level:
    org.hibernate.SQL: info
