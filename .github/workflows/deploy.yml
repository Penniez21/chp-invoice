name: Deploy

# ขึ้น image ใหม่ทุกครั้งที่ main เปลี่ยน (หรือกดรันเองจากหน้า Actions)
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  image:
    name: Build & push image ขึ้น GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: ล็อกอิน GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # ออกให้อัตโนมัติ ไม่ต้องตั้งเอง

      - name: ตั้งชื่อ tag
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  redeploy:
    name: สั่ง Koyeb ดึง image ใหม่
    needs: image
    runs-on: ubuntu-latest
    # ข้ามขั้นนี้ถ้ายังไม่ได้ตั้ง secret — จะได้ไม่ทำให้ workflow แดงตอนยังไม่พร้อม
    if: ${{ vars.KOYEB_SERVICE_ID != '' }}
    steps:
      - name: เรียก Koyeb API ให้ redeploy
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${{ secrets.KOYEB_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"deployment_group":"prod"}' \
            "https://app.koyeb.com/v1/services/${{ vars.KOYEB_SERVICE_ID }}/redeploy"
