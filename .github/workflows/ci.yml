name: CI

# ตรวจทุก push และทุก PR — ไม่ให้โค้ดที่พังหลุดเข้า main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: หลังบ้าน — ทดสอบ
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ติดตั้ง JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: รันเทส
        working-directory: backend
        run: mvn -B verify

      - name: เก็บผลเทสไว้ดูตอนพัง
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/

  frontend:
    name: หน้าบ้าน — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ติดตั้ง Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      # build ที่นี่ผ่าน เพราะรันบน Linux — บนเครื่องพัฒนา Windows จะติด Smart App Control
      - name: Production build
        working-directory: frontend
        run: npm run build
